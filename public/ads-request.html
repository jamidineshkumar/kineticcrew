<style>
:root{color-scheme:dark;--kc-bg:#101214;--kc-panel:#202427;--kc-edge:rgba(255,255,255,.09);--kc-text:#f2f0ed;--kc-muted:#a2a4a5;--kc-accent:#ff9877}
*{box-sizing:border-box}
html{min-height:100%;background:#101214}
body{margin:0;min-height:100vh;padding:clamp(12px,3vw,22px);background:radial-gradient(ellipse at 12% 8%,rgba(110,120,132,.11),transparent 34%),radial-gradient(ellipse at 88% 18%,rgba(255,105,76,.065),transparent 31%),#101214;color:var(--kc-text);font:400 14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.request{width:100%;max-width:560px;margin:12px auto 24px;padding:clamp(18px,4vw,26px);border:1px solid var(--kc-edge);border-radius:22px;background:linear-gradient(145deg,#252a2d,#1a1e21);box-shadow:7px 8px 22px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.035)}
.request>small:first-child{display:block;margin:0 0 8px;color:var(--kc-accent);font-size:10px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}
.request h1{margin:0 0 10px;color:#f5f3f0;font-size:clamp(27px,5.4vw,34px);font-weight:760;line-height:1.08;letter-spacing:-.045em}
.request h1 em{font-style:normal;color:var(--kc-accent)}
.request>p{margin:0 0 20px;max-width:48ch;color:var(--kc-muted);font-size:13px;line-height:1.55}
.request form{display:grid;gap:15px}
.request label{display:grid;gap:7px;color:#e9e7e4;font-size:13px;font-weight:600;line-height:1.3}
.request input:not([type=file]),.request textarea{display:block;width:100%;min-width:0;min-height:48px;padding:12px 14px;border:1px solid rgba(255,255,255,.085);border-radius:13px;background:linear-gradient(145deg,#191d20,#24292c);color:#f1efec;box-shadow:inset 4px 4px 9px rgba(0,0,0,.28),inset -3px -3px 8px rgba(255,255,255,.02);font:400 14px/1.45 inherit}
.request textarea{min-height:92px;resize:vertical}
.request input::placeholder,.request textarea::placeholder{color:#85898b}
.request input:focus,.request textarea:focus{outline:2px solid rgba(255,152,119,.7);outline-offset:2px;border-color:rgba(255,152,119,.4)}
.request input[type=file]{width:100%;min-height:70px;padding:12px;border:1px dashed rgba(255,255,255,.17);border-radius:14px;background:rgba(0,0,0,.18);color:#d9d7d4;font:13px system-ui,sans-serif}
.request input[type=file]::file-selector-button{margin-right:12px;padding:10px 14px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:linear-gradient(145deg,#303538,#202427);color:#f2f0ed;font:650 13px system-ui,sans-serif;box-shadow:3px 4px 10px rgba(0,0,0,.25)}
.request .hint{display:block;margin:-8px 0 0;color:var(--kc-muted);font-size:11px;line-height:1.45}
.request button{width:100%;min-height:48px;padding:13px 16px;border:1px solid rgba(255,184,155,.25);border-radius:14px;background:linear-gradient(145deg,#ff9877,#e9684d);color:#211411;font-size:14px;font-weight:800;box-shadow:0 7px 18px rgba(0,0,0,.28),inset 1px 1px 0 rgba(255,255,255,.22)}
.request button:disabled{opacity:.6}
.request .status{display:block;min-height:18px;margin:0;color:#ffb094;font-size:12px;line-height:1.45}
@media(max-width:480px){body{padding:10px}.request{margin:8px auto 18px;padding:19px 17px;border-radius:19px}.request>p{margin-bottom:17px}.request form{gap:14px}}
.request-brand{display:flex;align-items:center;gap:15px;margin:0 0 15px}.request-brand>img{display:block;flex:0 0 68px;width:68px;height:68px;object-fit:contain;border:1px solid rgba(255,255,255,.12);border-radius:19px;background:#08090d;box-shadow:5px 6px 16px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.06)}.request-brand-copy{min-width:0}.request-brand-copy>small{display:block;margin:0 0 6px;color:#ff9877;font-size:9px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}.request-brand-copy h1{margin:0;font-size:clamp(23px,5vw,31px);line-height:1.08;letter-spacing:-.045em}.request-brand-copy h1 em{font-style:normal;color:#ff9877}.request>p{margin:0 0 20px}.request label{font-size:13px;font-weight:600}.request input:not([type=file]),.request textarea{font-size:14px;line-height:1.45}@media(max-width:390px){.request-brand{gap:11px}.request-brand>img{flex-basis:58px;width:58px;height:58px;border-radius:16px}.request-brand-copy h1{font-size:23px}.request-brand-copy>small{font-size:8px;letter-spacing:.1em}}

.request{max-width:520px;padding:clamp(20px,4vw,28px);border-radius:24px}
.request-brand{gap:14px;margin-bottom:18px;align-items:center}
.request-brand>img{flex:0 0 64px;width:64px;height:64px;border-radius:17px;object-fit:contain}
.request-brand-copy{flex:1;min-width:0}
.request-brand-copy>small{font-size:9px;line-height:1.4;letter-spacing:.12em}
.request-brand-copy h1{font-size:clamp(22px,5vw,30px);line-height:1.08;overflow-wrap:anywhere}
.request>p{max-width:46ch;margin-bottom:24px;font-size:13.5px}
.request form{gap:16px}
.request label{gap:8px;font-size:13px}
.request input:not([type=file]),.request textarea{min-height:50px;border-radius:14px;padding:13px 15px}
.request textarea{min-height:104px}
.request input[type=file]{min-height:64px;padding:10px;border-radius:14px}

.request button{margin-top:2px;min-height:50px;border-radius:15px}
@media(max-width:390px){.request{padding:18px 15px}.request-brand{gap:10px}.request-brand>img{flex-basis:56px;width:56px;height:56px}.request-brand-copy h1{font-size:22px}.request-brand-copy>small{font-size:8px}}

/* Keep the complete advertiser heading on one line; animate only the brand name. */
.request-brand-copy{flex:1 1 auto;min-width:0}
.request-brand-copy h1{
  white-space:nowrap;
  overflow:visible;
  font-size:clamp(15px,4.6vw,24px);
  line-height:1.12;
  letter-spacing:-.055em;
}
.request-brand-copy h1 em{
  display:inline;
  color:transparent;
  background:linear-gradient(105deg,#ff7a59 0%,#ff4fa3 22%,#b56bff 46%,#55c7ff 68%,#7cf0cf 84%,#ff9877 100%);
  background-size:260% 100%;
  background-position:0% 50%;
  background-clip:text;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:kcAdvertiserBrandGradient 5s ease-in-out infinite;
}
@keyframes kcAdvertiserBrandGradient{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
@media(max-width:360px){
  .request-brand{gap:8px}
  .request-brand>img{flex-basis:50px;width:50px;height:50px}
  .request-brand-copy h1{font-size:15px;letter-spacing:-.06em}
  .request-brand-copy>small{font-size:7px;letter-spacing:.08em}
}
@media(prefers-reduced-motion:reduce){
  .request-brand-copy h1 em{animation:none;background-position:50% 50%}
}

</style>
</head>
<body>
<main class="request">
<header class="request-brand">
  <img id="kcPublicBrandLogo" data-kc-brand src="kinetic-crew-logo.svg?v=20261122-official-mark2" alt="Kinetic Crew logo" width="76" height="76">
  <div class="request-brand-copy">
    <small>KINETIC CREW · ADVERTISER REQUEST</small>
    <h1>Advertise with <em>Kinetic Crew</em></h1>
  </div>
</header>
<p>Submit your business or brand campaign for review. All ads are free during the initial launch and require Admin approval.</p>
<form id="requestForm">
<label>Business / brand name<input name="brand" required maxlength="120" autocomplete="organization"></label>
<label>Contact email<input name="email" type="email" required maxlength="254" autocomplete="email"></label>
<label>Ad title<input name="title" required maxlength="100"></label>
<label>Caption<textarea name="caption" maxlength="260" rows="3"></textarea></label>
<label>Ad image<input name="creative" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" required></label>
<small class="hint">Main campaign image · JPG, PNG or WebP · Maximum 8 MB. Video uploads are not supported.</small>

<label>Website / click destination (optional)<input name="destination" type="url" placeholder="https://example.com" inputmode="url"></label>
<button type="submit">Submit ad request</button>
<small id="requestStatus" class="status" role="status" aria-live="polite"></small>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js?v=20261112-persistent-session1"></script>
<script>
// Load the official Super Admin brand logo for the public advertiser form.
(async()=>{
 const image=document.getElementById('kcPublicBrandLogo');
 const db=window.kcSupabase;
 if(!image||!db?.rpc)return;
 try{
  const {data,error}=await db.rpc('crew_get_brand_identity');
  if(error)throw error;
  const assets=data?.assets||{};
  const url=assets.external_forms||assets.app||data?.logo_url||'';
  if(url)image.src=url;
 }catch(error){console.info('Using the default Kinetic Crew logo on the advertiser form.',error);}
})();
document.getElementById('requestForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const f=e.currentTarget,b=f.querySelector('button'),s=document.getElementById('requestStatus');
 const file=f.elements.namedItem('creative').files[0];
 
 const value=n=>f.elements.namedItem(n).value.trim();
 const allowed=['image/jpeg','image/png','image/webp'];
 if(!file){s.textContent='Please choose an ad image.';return}
 if(!allowed.includes(file.type)){s.textContent='Only JPG, PNG or WebP images are supported.';return}
 if(file.size>8*1024*1024){s.textContent='Ad image must be 8 MB or smaller.';return}
 b.disabled=true;
 try{
  const uploadImage=async(image,folder)=>{
   const ext=image.type==='image/jpeg'?'jpg':image.type==='image/png'?'png':'webp';
   const path=folder+'/'+crypto.randomUUID()+'.'+ext;
   const uploaded=await window.kcSupabase.storage.from('kc-ad-requests').upload(path,image,{upsert:false,contentType:image.type});
   if(uploaded.error)throw uploaded.error;
   return window.kcSupabase.storage.from('kc-ad-requests').getPublicUrl(path).data.publicUrl;
  };
  s.textContent='Uploading ad image…';
  const mediaUrl=await uploadImage(file,'requests');
  s.textContent='Submitting your request…';
  const result=await window.kcSupabase.rpc('crew_ads_request_submit',{
   p_advertiser_name:value('brand'),
   p_advertiser_email:value('email'),
   p_title:value('title'),
   p_caption:value('caption'),
   p_media_type:'image',
   p_media_url:mediaUrl,
   p_destination_url:value('destination')||null,
   p_ad_format:'native',
   p_placement:'home',
   p_advertiser_logo_url:null
  });
  if(result.error)throw result.error;
  s.textContent='Request received. Kinetic Crew will review your image and campaign before publication.';
  f.reset();
 }catch(err){s.textContent=err.message||'Could not submit request. Please try again.'}
 finally{b.disabled=false}
});
</script>
</body>
