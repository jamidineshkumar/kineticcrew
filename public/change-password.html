<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080910"><meta name="robots" content="noindex,nofollow"><title>Kinetic Crew · Change Password</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme-overrides.css"><link rel="stylesheet" href="kc-audition-portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body class="ka-body"><div class="ka-shell"><header class="ka-header"><div class="ka-brand">KINETIC CREW<small>ACCOUNT SECURITY</small></div><a href="index.html" class="ka-icon-btn" style="text-decoration:none">←</a></header><main class="ka-main"><section class="ka-hero"><div class="ka-eyebrow">SECURE YOUR ACCOUNT</div><h1>Change<br><span style="color:var(--ka-accent)">password</span></h1><p id="intro">Use a strong password that only you know.</p></section><section class="ka-panel"><div id="requiredNotice" class="ka-notice" hidden>For security, replace your temporary password before continuing.</div><form id="passwordForm"><label class="ka-field">Current password<input id="currentPassword" type="password" autocomplete="current-password" required></label><label class="ka-field">New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label class="ka-field">Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><p class="ka-muted" style="font-size:11px">Use at least 8 characters. Avoid reusing passwords from other accounts.</p><button class="ka-action" id="savePassword" type="submit">Update Password →</button><p id="message" class="ka-muted" role="status" aria-live="polite"></p></form></section></main></div>
<script>
(()=>{'use strict';const client=window.kcSupabase,form=document.getElementById('passwordForm'),message=document.getElementById('message'),required=new URLSearchParams(location.search).get('required')==='1';document.getElementById('requiredNotice').hidden=!required;
function say(t,e){message.textContent=t||'';message.style.color=e?'#ffaaaa':'#9de0b6';}
async function boot(){if(!client)throw new Error(window.KC_CONFIG_ERROR||'Authentication service unavailable.');const {data:session}=await client.auth.getSession();if(!session?.session){location.replace('login.html');return;}const {data:access,error}=await client.rpc('crew_access_status',{});if(error)throw error;if(access?.status==='rejected'){try{localStorage.setItem('kc_audition_notice','rejected');}catch{}await client.auth.signOut({scope:'local'});location.replace('login.html?audition=rejected');return;}if(access?.status!=='approved'){location.replace('pending.html');return;}const {data:userData}=await client.auth.getUser();if(!userData?.user?.email)throw new Error('Could not read the account email. Sign in again.');form.dataset.email=userData.user.email;form.dataset.role=access.role||'member';}
form.addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('savePassword');button.disabled=true;say('');try{const current=document.getElementById('currentPassword').value,next=document.getElementById('newPassword').value,confirmValue=document.getElementById('confirmPassword').value;if(next.length<8)throw new Error('Your new password must contain at least 8 characters.');if(next!==confirmValue)throw new Error('The new passwords do not match.');if(next===current)throw new Error('Choose a password different from your current password.');const verifier=window.supabase.createClient(window.KC_CONFIG.supabaseUrl,window.KC_CONFIG.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {error:verifyError}=await verifier.auth.signInWithPassword({email:form.dataset.email,password:current});if(verifyError)throw new Error('Your current password is incorrect.');const {error:updateError}=await client.auth.updateUser({password:next});if(updateError)throw updateError;const {error:clearError}=await client.rpc('crew_audition_clear_temporary_password',{});if(clearError)throw clearError;say('Password updated successfully. Redirecting…',false);setTimeout(()=>location.replace(form.dataset.role==='audition_participant'?'audition.html':'index.html'),650);}catch(error){say(error.message||'Could not update your password.',true);}finally{button.disabled=false;}});
boot().catch(e=>say(e.message||'Could not load account security.',true));
})();</script></body></html>
