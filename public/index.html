<script>
(function(){
 function clean(node){
  if(!node)return;
  const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);
  const remove=[];
  while(walker.nextNode()){
   const t=walker.currentNode;
   if(/\\\\[nr]/.test(t.nodeValue||'') && /^[\\s\\\\nr]+$/.test(t.nodeValue||''))remove.push(t);
  }
  remove.forEach(t=>t.parentNode&&t.parentNode.removeChild(t));
 }
 function start(){
  clean(document.body);
  new MutationObserver(records=>records.forEach(r=>{
   r.addedNodes.forEach(n=>{if(n.nodeType===Node.TEXT_NODE){if(/\\\\[nr]/.test(n.nodeValue||'')&&/^[\\s\\\\nr]+$/.test(n.nodeValue||''))n.remove();}else if(n.nodeType===Node.ELEMENT_NODE)clean(n);});
  })).observe(document.body,{childList:true,subtree:true});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
<script>
(()=>{const slash=String.fromCharCode(92);const clean=root=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode()){const n=w.currentNode,v=n.nodeValue||'';const z=v.split(slash+'n').join('').split(slash+'r').join('');if(z.trim()===''&&z!==v)nodes.push(n);}nodes.forEach(n=>n.remove());};clean(document.body);new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===Node.TEXT_NODE){const v=n.nodeValue||'',z=v.split(slash+'n').join('').split(slash+'r').join('');if(z.trim()===''&&z!==v)n.remove();}else if(n.nodeType===Node.ELEMENT_NODE)clean(n);}))).observe(document.body,{childList:true,subtree:true});})();
</script>
