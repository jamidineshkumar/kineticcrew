window.addEventListener('error',function(e){
 if(e.filename&&/app\.js(?:\?|$)/.test(e.filename)){

  if(root&&root.textContent.includes('Opening Kinetic Crew')){
   const detail=String(e.message||'Unknown JavaScript error')+' (line '+String(e.lineno||'?')+', column '+String(e.colno||'?')+')';

   const detailNode=document.getElementById('kc-start-diagnostic');if(detailNode)detailNode.textContent=detail;
  }
 }
},true);
window.addEventListener('unhandledrejection',function(e){
 const root=document.getElementById('app');

  const detail=String(e.reason?.stack||e.reason?.message||e.reason||'Unknown promise rejection');
  root.innerHTML='<div class="kc-start-error" role="alert"><strong>Kinetic Crew could not start</strong><p>Startup promise failed. Share this diagnostic with the administrator.</p><pre id="kc-start-diagnostic" style="white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;font-size:12px;max-width:100%;opacity:.85"></pre><button type="button" onclick="location.reload()">Reload app</button></div>';
  const detailNode=document.getElementById('kc-start-diagnostic');if(detailNode)detailNode.textContent=detail.slice(0,1200);
 }
});

<script>
(function(){
 function clean(node){
  if(!node)return;
  const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);
  const remove=[];
  while(walker.nextNode()){
   const t=walker.currentNode;
   if(/\\\\[nr]/.test(t.nodeValue||'') && /^[\\s\\\\nr]+$/.test(t.nodeValue||''))remove.push(t);
  }
  remove.forEach(t=>t.parentNode&&t.parentNode.removeChild(t));
 }
 function start(){
  clean(document.body);
  new MutationObserver(records=>records.forEach(r=>{
   r.addedNodes.forEach(n=>{if(n.nodeType===Node.TEXT_NODE){if(/\\\\[nr]/.test(n.nodeValue||'')&&/^[\\s\\\\nr]+$/.test(n.nodeValue||''))n.remove();}else if(n.nodeType===Node.ELEMENT_NODE)clean(n);});
  })).observe(document.body,{childList:true,subtree:true});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
<script>
(()=>{const slash=String.fromCharCode(92);const clean=root=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode()){const n=w.currentNode,v=n.nodeValue||'';const z=v.split(slash+'n').join('').split(slash+'r').join('');if(z.trim()===''&&z!==v)nodes.push(n);}nodes.forEach(n=>n.remove());};clean(document.body);new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===Node.TEXT_NODE){const v=n.nodeValue||'',z=v.split(slash+'n').join('').split(slash+'r').join('');if(z.trim()===''&&z!==v)n.remove();}else if(n.nodeType===Node.ELEMENT_NODE)clean(n);}))).observe(document.body,{childList:true,subtree:true});})();
</script>
