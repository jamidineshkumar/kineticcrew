   root.innerHTML='<div class="kc-start-error" role="alert"><strong>Kinetic Crew could not start</strong><p>The app script failed to load. Please reload once. If this continues, contact the crew administrator.</p><button type="button" onclick="location.reload()">Reload app</button></div>';
