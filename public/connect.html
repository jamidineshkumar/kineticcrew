<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111316">
<meta name="description" content="Connect with a Kinetic Crew member.">
<title>Kinetic Crew · Connect</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101215;color:#f5f3ef;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 12% 8%,#33302a 0,transparent 38%),radial-gradient(ellipse at 88% 92%,#282b30 0,transparent 42%),#101215}
.connect-card{width:min(100%,420px);padding:26px;border:1px solid #b9a98e88;border-radius:28px;background:linear-gradient(145deg,#333438 0%,#202226 34%,#15171a 100%);box-shadow:inset 0 1px 0 #ffffff30,0 30px 90px #0009;position:relative;overflow:hidden}
.connect-card:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(112deg,#ffffff08 0 1px,transparent 1px 5px);opacity:.4}
.brand,.identity,.actions,.footer{position:relative;z-index:1}.brand{display:flex;justify-content:space-between;align-items:center;color:#e1d0b2;font-size:10px;font-weight:800;letter-spacing:.2em}.brand span+span{color:#a9aaad;font-size:9px}
.identity{display:flex;align-items:center;gap:17px;margin:38px 0 30px}.avatar{width:92px;height:92px;flex:0 0 92px;border-radius:22px;object-fit:cover;border:1px solid #d4c2a1;box-shadow:0 0 0 5px #d4c2a11a,0 12px 28px #0008;background:#292c30}.initials{display:grid;place-items:center;color:#e5d4b7;font-size:28px;font-weight:700}.identity h1{font-size:clamp(22px,6vw,28px);line-height:1.1;margin:0 0 8px;overflow-wrap:anywhere}.identity p{margin:0;color:#c7b99f;font-size:14px}
.actions{display:grid;gap:11px}.actions a{min-height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-radius:15px;text-decoration:none;font-size:14px;font-weight:700}.instagram{background:linear-gradient(110deg,#d9c5a1,#b89a70);color:#18191b}.kinetic{border:1px solid #d4c2a177;background:#ffffff09;color:#f2e7d5}.actions a span:last-child{font-size:19px}.footer{margin-top:25px;text-align:center;color:#929498;font-size:10px;letter-spacing:.13em}
</style>
</head>
<body>
<main class="connect-card">
 <div class="brand"><span>KINETIC CREW</span><span>DIGITAL IDENTITY</span></div>
 <section class="identity">
  <div id="avatar" class="avatar initials">KC</div>
  <div><h1 id="name">Kinetic Crew Member</h1><p id="handle">@crew-member</p></div>
 </section>
 <nav class="actions" aria-label="Connect">
  <a id="instagram" class="instagram" href="#" target="_blank" rel="noopener noreferrer"><span>Instagram profile</span><span>↗</span></a>
  <a id="kinetic" class="kinetic" href="#"><span>Kinetic Crew profile</span><span>↗</span></a>
 </nav>
 <div class="footer">SCAN · CONNECT · MOVE TOGETHER</div>
</main>
<script>
(()=>{const q=new URLSearchParams(location.search),name=q.get('n')||'Kinetic Crew Member',handle=(q.get('u')||'crew-member').replace(/^@/,'').replace(/[^a-zA-Z0-9._]/g,''),id=q.get('id')||'',photo=q.get('p')||'';document.title=name+' · Kinetic Crew';document.getElementById('name').textContent=name;document.getElementById('handle').textContent='@'+handle;const avatar=document.getElementById('avatar');if(photo){try{const u=new URL(photo);if(u.protocol==='https:'){const img=document.createElement('img');img.className='avatar';img.alt='Profile photo';img.src=u.href;avatar.replaceWith(img);}}catch{}}document.getElementById('instagram').href='https://www.instagram.com/'+encodeURIComponent(handle)+'/';const kc=document.getElementById('kinetic');if(id){const target=new URL('index.html',location.href);target.searchParams.set('kc_profile',id);kc.href=target.href;}else{kc.hidden=true;}})();
</script>
</body>
</html>
