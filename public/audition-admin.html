<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080910"><meta name="robots" content="noindex,nofollow"><title>Kinetic Crew · Audition Management</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme-overrides.css"><link rel="stylesheet" href="kc-audition-portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body class="ka-body"><div class="ka-shell"><header class="ka-header"><div class="ka-brand">KINETIC CREW<small>AUDITION MANAGEMENT</small></div><div class="ka-row"><button class="ka-icon-btn" id="refresh">↻</button><a class="ka-icon-btn" href="index.html" style="text-decoration:none">←</a></div></header><main class="ka-main" id="adminRoot"><div class="ka-empty">Loading audition applications…</div></main></div>
<script>
(()=>{'use strict';const client=window.kcSupabase,root=document.getElementById('adminRoot');const state={role:'',apps:[],notice:'',error:false,last:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>{const d=new Date(v);return Number.isNaN(+d)?'—':d.toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});};
const rand=n=>{const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789",b=crypto.getRandomValues(new Uint8Array(n));return Array.from(b,x=>chars[x%chars.length]).join('');};
const chip=v=>'<span class="ka-chip '+(v==='accept'?'good':v==='reject'?'bad':'warn')+'">'+esc(v||'Pending')+'</span>';
function setNotice(t,e){state.notice=t;state.error=!!e;render();}
function details(a){const entries=Object.entries(a.application_data||{});return entries.length?'<div class="ka-announcement"><b>Application details</b><div style="display:grid;gap:7px;margin-top:9px">'+entries.map(([k,v])=>'<div><small class="ka-muted">'+esc(k.replaceAll('_',' '))+'</small><div>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</div></div>').join('')+'</div></div>':'';}
function video(a){const u=String(a.video_url||'').trim();if(!/^https:\/\//i.test(u))return '<div class="ka-empty">No audition video link submitted.</div>';const driveId=(u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([A-Za-z0-9_-]+)/i)||[])[1];if(driveId){const preview='https://drive.google.com/file/d/'+encodeURIComponent(driveId)+'/preview';return '<div style="width:100%;aspect-ratio:16/9;min-height:220px;border-radius:16px;overflow:hidden;background:#000"><iframe src="'+esc(preview)+'" title="Audition video preview" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin" style="width:100%;height:100%;border:0"></iframe></div><p class="ka-muted" style="font-size:11px;margin:6px 0 0">If the preview is blocked, confirm Google Drive access is set to Anyone with the link · Viewer.</p>';}return /\.(mp4|webm|ogg)(\?|$)/i.test(u)?'<video controls playsinline preload="metadata" style="width:100%;max-height:420px;border-radius:16px;background:#000" src="'+esc(u)+'"></video>':'<div class="ka-empty">This link cannot be previewed inline. Ask the applicant to submit a Google Drive share link with Anyone with the link · Viewer access.</div>';}
function card(a){
 const send=false,review=['submitted','credentials_sent','under_review','review_disagreement'].includes(a.application_status),cleanup=a.application_status==='rejected'&&!!a.auth_id;
 const other=state.role==='admin'?a.president_decision:a.admin_decision;
 return '<article class="ka-panel"><div class="ka-row"><div><div class="ka-eyebrow">APPLICATION · '+esc(date(a.created_at))+'</div><h2 style="margin:7px 0 4px">'+esc(a.name)+'</h2><div class="ka-muted" style="font-size:12px">'+esc(a.email)+'</div></div>'+chip(a.application_status.replaceAll('_',' '))+'</div>'+
 '<div class="ka-status-grid"><div class="ka-review"><b>Admin Review</b>'+chip(a.admin_decision||'Pending')+'</div><div class="ka-review"><b>President Review</b>'+chip(a.president_decision||'Pending')+'</div></div>'+details(a)+
 '<div style="display:grid;gap:10px;margin-top:14px"><b>Audition Video</b>'+video(a)+'</div>'+(a.username?'<p class="ka-muted" style="font-size:12px">Username: <b>'+esc(a.username)+'</b></p>':'')+
 (send?'<div style="margin-top:16px"><button class="ka-action" data-send="'+esc(a.id)+'">Generate 8-character password & prepare email →</button><p class="ka-muted" style="font-size:11px">Password is stored only as a one-way hash. Review and send the email draft.</p></div>':'')+
 (review?'<div style="margin-top:16px;border-top:1px solid var(--ka-line);padding-top:14px"><div class="ka-row"><b>'+(state.role==='admin'?'Admin Review':'President Review')+'</b><span class="ka-muted" style="font-size:11px">Other reviewer: '+(state.role==='admin'?'President':'Admin')+' · '+esc(other||'Pending')+'</span></div><div class="ka-row" style="margin-top:12px"><button class="ka-action" data-review="'+esc(a.id)+'" data-decision="accept">Accept</button><button class="ka-action secondary" data-review="'+esc(a.id)+'" data-decision="reject">Reject</button></div><p class="ka-muted" style="font-size:11px">Both reviewers must approve the same video for membership. Both must reject for final rejection.</p></div>':'')+
 (a.application_status==='selected'?'<div style="margin-top:16px"><button class="ka-action secondary" data-send-selection="'+esc(a.id)+'">Send / retry member credentials</button><p class="ka-muted" style="font-size:11px">Only available after both reviewers accept. The applicant receives a username, temporary password and member activation link.</p></div>':'')+
 (cleanup?'<div style="margin-top:16px"><button class="ka-action secondary" data-cleanup="'+esc(a.id)+'">Retry rejected-account cleanup</button></div>':'')+'</article>';
}
function render(){const total=state.apps.length,pending=state.apps.filter(a=>['submitted','credentials_sent','under_review','review_disagreement'].includes(a.application_status)).length;
 root.innerHTML='<section class="ka-hero"><div class="ka-eyebrow">'+(state.role==='super_admin'?'PRESIDENT / SUPER ADMIN':'ADMIN')+' CONTROL CENTER</div><h1>Audition<br><span style="color:var(--ka-accent)">Management</span></h1><p>Review applicant details and audition videos. Decisions are independent and apply to the same submitted video.</p><div class="ka-row" style="margin-top:16px;flex-wrap:wrap"><button class="ka-action" id="exportApplicants">Export applicants to Excel ↓</button><button class="ka-action secondary" id="refreshList">Refresh applications ↻</button></div></section>'+(state.notice?'<div class="'+(state.error?'ka-error':'ka-notice')+'">'+esc(state.notice)+'</div>':'')+
 (state.last?'<section class="ka-panel"><div class="ka-eyebrow">TEMPORARY CREDENTIALS · SHOWN ONCE</div><h2>Email this applicant</h2><p class="ka-muted" style="font-size:12px">The temporary password is not stored in the database. Send it before leaving this page.</p><div class="ka-review"><b>Username: '+esc(state.last.username)+'</b><div style="font-size:22px;letter-spacing:4px;color:var(--ka-accent);font-weight:900;margin-top:8px">'+esc(state.last.password)+'</div><small>'+esc(state.last.email)+'</small></div><div class="ka-row" style="margin-top:12px"><button class="ka-action" id="openDraft">Open email draft</button><button class="ka-action secondary" id="copyCreds">Copy credentials</button></div></section>':'')+
 '<section class="ka-panel"><div class="ka-status-grid"><div class="ka-review"><b>Applications</b><strong style="font-size:28px">'+total+'</strong></div><div class="ka-review"><b>In progress</b><strong style="font-size:28px">'+pending+'</strong></div></div></section>'+(state.apps.length?state.apps.map(card).join(''):'<section class="ka-panel"><div class="ka-empty">No applications yet. New applications submitted through the public audition form will appear here automatically.</div></section>');
}
function exportApplicants(){if(!state.apps.length){setNotice('There are no applicant records to export.',true);return;}if(!window.XLSX){setNotice('Excel export library did not load. Refresh and try again.',true);return;}const rows=state.apps.map(a=>{const extra={};Object.entries(a.application_data||{}).forEach(([k,v])=>{const key=String(k).replace(/[_\s]+/g,' ').trim();let value=typeof v==='object'&&v!==null?JSON.stringify(v):String(v??'');if(/^[=+@\-]/.test(value))value="'"+value;extra[key]=value;});return Object.assign({'Applicant Name':a.name||'','Email':a.email||'','Application ID':a.id||'','Application Status':a.application_status||'','Submitted At':a.created_at||'','Video URL':a.video_url||'','Admin Decision':a.admin_decision||'Pending','Admin Reviewed At':a.admin_reviewed_at||'','President Decision':a.president_decision||'Pending','President Reviewed At':a.president_reviewed_at||'','Username':a.username||''},extra);});const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.min(48,Math.max(16,k.length+4))}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Applicants');const summary=[{'Metric':'Total applicants','Value':state.apps.length},{'Metric':'Exported at','Value':new Date().toISOString()},{'Metric':'Pending / in progress','Value':state.apps.filter(a=>['submitted','credentials_sent','under_review','review_disagreement'].includes(a.application_status)).length}];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'Summary');const stamp=new Date().toISOString().slice(0,10);XLSX.writeFile(wb,'Kinetic_Crew_Audition_Applicants_'+stamp+'.xlsx');setNotice('Exported '+rows.length+' applicant record(s) to Excel.',false);}
const withTimeout=(promise,label,ms=15000)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out. Check your connection and tap Retry.')),ms))]);async function load(){const refreshButtons=[...document.querySelectorAll('#refresh,#refreshList')];refreshButtons.forEach(b=>b.disabled=true);root.innerHTML='<div class="ka-empty" role="status" aria-live="polite">Connecting to Kinetic Crew…</div>';try{if(!client)throw new Error(window.KC_CONFIG_ERROR||'Supabase client unavailable.');const {data:session}=await withTimeout(client.auth.getSession(),'Session check');if(!session?.session){location.replace('login.html');return;}const {data:access,error:ae}=await withTimeout(client.rpc('crew_access_status',{}),'Admin permission check');if(ae)throw ae;if(access?.status!=='approved'||!['admin','super_admin'].includes(access?.role)){location.replace('index.html');return;}state.role=access.role;const {data,error}=await withTimeout(client.rpc('crew_audition_list_applications',{}),'Application list');if(error)throw error;state.apps=Array.isArray(data)?data:[];state.notice='';state.error=false;render();}catch(error){console.error('Audition Management load failed:',error);root.innerHTML='<section class="ka-panel"><div class="ka-error" role="alert">'+esc(error.message||'Could not load audition applications.')+'</div><p class="ka-muted">Your applications have not been changed. Retry the connection to load them.</p><button class="ka-action" id="retryLoad">Retry loading applications ↻</button></section>';}finally{refreshButtons.forEach(b=>b.disabled=false);}}
async function sendCredentials(id){const a=state.apps.find(x=>String(x.id)===String(id));if(!a)return;const password=rand(8),username='aud'+rand(5).toLowerCase();const {error}=await client.rpc('crew_audition_prepare_credentials',{p_application_id:id,p_username:username,p_temporary_password:password});if(error)throw error;state.last={email:a.email,name:a.name,username,password};state.notice='Temporary credentials generated. Open the email draft and tap Send.';state.error=false;const {data}=await client.rpc('crew_audition_list_applications',{});state.apps=Array.isArray(data)?data:state.apps;render();}
function openDraft(){const c=state.last;if(!c)return;const link=new URL('login.html',location.href);link.searchParams.set('audition','credentials-sent');link.searchParams.set('username',c.username);link.searchParams.set('email',c.email);const subject='Your Kinetic Crew audition login details';const body='Hello '+c.name+',\n\nYour Kinetic Crew Audition Portal access is ready.\n\nUsername: '+c.username+'\nTemporary password: '+c.password+'\n\nThis is an 8-character temporary password. Open the link below, choose Sign Up, enter these exact credentials and verify your email. You will be asked to change the temporary password after your first sign-in.\n\n'+link.href+'\n\nKinetic Crew';location.href='mailto:'+encodeURIComponent(c.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);}
async function cleanup(a){if(a.video_storage_path){const {error}=await client.storage.from('audition-videos').remove([String(a.video_storage_path)]);if(error)throw error;}const {error:prepError}=await client.rpc('crew_audition_prepare_rejection_delete',{p_auth_id:a.auth_id});if(prepError)throw prepError;const {data:removed,error:removeError}=await client.functions.invoke('delete-crew-member',{body:{authId:a.auth_id}});if(removeError)throw removeError;if(removed?.error&&!/not found/i.test(removed.error))throw new Error(removed.error);const {error:finalError}=await client.rpc('crew_audition_finalize_rejection',{p_application_id:a.id});if(finalError)throw finalError;}
async function review(id,decision){const a=state.apps.find(x=>String(x.id)===String(id));if(!a)return;if(!confirm(decision==='accept'?'Record your independent approval?':'Record your independent rejection?'))return;const {data:r,error}=await client.rpc('crew_audition_review',{p_application_id:id,p_decision:decision});if(error)throw error;if(r?.application_status==='rejected'&&r?.auth_id){await cleanup(a);state.notice='Both reviewers rejected the audition. The participant was signed out and their application, profile and stored audition video were deleted.';}else if(r?.application_status==='selected'){const {data:mail,error:mailError}=await client.functions.invoke('send-audition-selection-email',{body:{applicationId:id}});state.notice=mailError?'Both reviewers approved the audition, but the member credentials email could not be delivered. Use “Send / retry member credentials” below.':(mail?.alreadySent?'Both reviewers approved the audition. Member credentials were already emailed.':mail?.inProgress?'Both reviewers approved the audition. The credentials email is being processed.':'Both reviewers approved the same video. Member login credentials were emailed to '+a.email+'.');}else if(r?.application_status==='review_disagreement')state.notice='The reviewers have different decisions. The application remains under review.';else state.notice='Your decision was recorded. The participant can now see the updated status.';state.error=false;const {data}=await client.rpc('crew_audition_list_applications',{});state.apps=Array.isArray(data)?data:[];render();}
async function cleanupById(id){const a=state.apps.find(x=>String(x.id)===String(id));if(!a)return;await cleanup(a);state.notice='Rejected applicant cleanup completed.';state.error=false;const {data}=await client.rpc('crew_audition_list_applications',{});state.apps=Array.isArray(data)?data:[];render();}
document.addEventListener('click',async e=>{const send=e.target.closest('[data-send]'),reviewButton=e.target.closest('[data-review]'),selection=e.target.closest('[data-send-selection]'),clean=e.target.closest('[data-cleanup]');try{if(send){send.disabled=true;await sendCredentials(send.dataset.send);}else if(reviewButton){reviewButton.disabled=true;await review(reviewButton.dataset.review,reviewButton.dataset.decision);}else if(selection){selection.disabled=true;const {data,error}=await client.functions.invoke('send-audition-selection-email',{body:{applicationId:selection.dataset.sendSelection}});if(error)throw error;setNotice(data?.alreadySent?'Member credentials were already emailed. No duplicate was sent.':data?.alreadyActivated?'This applicant already has an active member account.':data?.inProgress?'The credentials email is already being processed.':'Member login credentials emailed to the selected applicant.',false);}else if(clean){clean.disabled=true;await cleanupById(clean.dataset.cleanup);}else if(e.target.closest('#exportApplicants'))exportApplicants();else if(e.target.closest('#refresh')||e.target.closest('#refreshList')||e.target.closest('#retryLoad'))await load();else if(e.target.closest('#openDraft'))openDraft();else if(e.target.closest('#copyCreds')&&state.last){await navigator.clipboard.writeText('Username: '+state.last.username+'\nTemporary password: '+state.last.password+'\nEmail: '+state.last.email);setNotice('Credentials copied. Send them only to the registered applicant email.',false);}}catch(error){setNotice(error.message||'Audition action failed.',true);}});
load().catch(e=>{console.error(e);root.innerHTML='<div class="ka-error">'+esc(e.message||'Could not load applications.')+'</div>';});
setInterval(async()=>{if(document.visibilityState!=='visible'||!client||!state.role)return;try{const {data,error}=await client.rpc('crew_audition_list_applications',{});if(!error){state.apps=Array.isArray(data)?data:[];render();}}catch(error){console.warn('Audition application auto-refresh failed:',error);}},15000);
})();</script></body></html>
