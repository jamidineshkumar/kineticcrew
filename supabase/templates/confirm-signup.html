<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Kinetic Crew verification code</title>
</head>
<body style="margin:0;padding:32px 14px;background:#080a0d;font-family:Arial,Helvetica,sans-serif;color:#eef0f4">
<div style="display:none;max-height:0;overflow:hidden;opacity:0">Your Kinetic Crew verification code: {{ .Token }}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#080a0d">
<tr><td align="center" style="padding:20px 8px">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px">
<tr><td align="center" style="padding:10px 12px 26px">
<div style="font-size:22px;line-height:1.2;font-weight:900;letter-spacing:3px;color:#f2f3f6">KINETIC <span style="color:#a7a9b3">CREW</span></div>
</td></tr>
<tr><td style="padding:28px 22px 30px;border:1px solid #292d34;border-radius:28px;background:#171a20;box-shadow:12px 12px 28px #050609,-10px -10px 26px #222630">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
<tr><td align="center" style="padding:8px 8px 24px">
<div style="font-size:10px;font-weight:700;letter-spacing:4px;color:#9ca2ad">EMAIL VERIFICATION</div>
</td></tr>
<tr><td align="center" style="padding:0 4px 12px">
<div style="display:inline-block;padding:23px 18px;width:calc(100% - 36px);max-width:380px;border-radius:20px;background:#101217;border:1px solid #252a32;box-shadow:inset 7px 7px 16px #08090d,inset -7px -7px 16px #1b2029">
<div style="font-size:36px;line-height:1.35;font-weight:800;letter-spacing:9px;color:#b7a0ff;text-align:center;white-space:nowrap">{{ .Token }}</div>
</div>
</td></tr>
<tr><td align="center" style="padding:16px 8px 0">
<div style="font-size:10px;letter-spacing:2px;color:#7f8793">KINETIC CREW · CREW HQ</div>
</td></tr>
</table>
</td></tr>
<tr><td align="center" style="padding:18px 8px 0;font-size:10px;letter-spacing:1px;color:#606875">KINETIC CREW</td></tr>
</table>
</td></tr></table>
</body>
</html>
